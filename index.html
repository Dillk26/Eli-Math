<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eli's Session Review</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #06B6D4;
            --accent: #F59E0B;
            --bg: #F0F9FF;
            --card-bg: #FFFFFF;
            --text: #1E293B;
            --text-light: #64748B;
            --correct: #10B981;
            --correct-bg: #D1FAE5;
            --incorrect: #EF4444;
            --incorrect-bg: #FEE2E2;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #4F46E5, #06B6D4);
            color: white;
            padding: 24px;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
        }

        h1 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 1.1rem;
            opacity: 0.95;
            font-weight: 500;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            padding: 10px 20px;
            border-radius: 12px;
            margin-top: 16px;
            font-weight: 700;
            font-size: 1rem;
        }

        .progress-container {
            width: 100%;
            max-width: 800px;
            background: #E2E8F0;
            height: 12px;
            border-radius: 6px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            transition: width 0.3s ease;
        }

        .mode-toggle {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .mode-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary);
            background: white;
            color: var(--primary);
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .mode-btn.active {
            background: var(--primary);
            color: white;
        }

        .quiz-container {
            width: 100%;
            max-width: 800px;
        }

        .question-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px -1px rgba(0, 0, 0, 0.08);
            border: 1px solid #E2E8F0;
            transition: transform 0.2s;
        }

        .question-number {
            font-family: 'Fredoka', sans-serif;
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            line-height: 1.4;
        }

        .svg-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #F8FAFC;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px dashed #CBD5E1;
        }

        .svg-container svg {
            max-width: 100%;
            height: auto;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            padding: 14px 18px;
            text-align: left;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #EEF2FF;
        }

        .option-btn.selected-correct {
            background: var(--correct-bg) !important;
            border-color: var(--correct) !important;
            color: #065F46 !important;
        }

        .option-btn.selected-incorrect {
            background: var(--incorrect-bg) !important;
            border-color: var(--incorrect) !important;
            color: #991B1B !important;
        }

        .explanation-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            border-radius: 12px;
            background: #F1F5F9;
            border-left: 5px solid var(--primary);
            font-size: 0.98rem;
            line-height: 1.5;
            color: #334155;
        }

        .explanation-box.visible {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        .explanation-title {
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-controls {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            background: #94A3B8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .results-card {
            display: none;
            background: white;
            border-radius: var(--radius);
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        .results-card h2 {
            font-family: 'Fredoka', sans-serif;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .score-badge {
            font-size: 3.5rem;
            font-family: 'Fredoka', sans-serif;
            color: var(--accent);
            margin: 16px 0;
        }

        .result-message {
            font-size: 1.2rem;
            color: var(--text-light);
            margin-bottom: 28px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Eli's Session Review</h1>
        <p class="subtitle">Perimeter of Squares & Rectangles + Angles Practice</p>
        <div class="stats-bar">
            <span>Question <span id="current-q-num">1</span> of 20</span>
            <span>Score: <span id="score-display">0</span> / 20</span>
        </div>
    </header>

    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn active" id="single-mode-btn" onclick="switchMode('single')">Step-by-Step Mode</button>
        <button class="mode-btn" id="all-mode-btn" onclick="switchMode('all')">View All Questions</button>
    </div>

    <main class="quiz-container" id="quiz-container">
        <!-- Questions injected via JS -->
    </main>

    <div class="results-card" id="results-card">
        <h2>🎉 Review Complete!</h2>
        <div class="score-badge" id="final-score">0 / 20</div>
        <p class="result-message" id="final-message">Great job completing your geometry review session!</p>
        <button class="action-btn" onclick="resetQuiz()">Try Again 🔄</button>
    </div>

    <script>
        const quizData = [
            // PERIMETER QUESTIONS (1 to 12)
            {
                q: "What is the perimeter of a square with a side length of 5 cm?",
                svg: `<svg width="180" height="150" viewBox="0 0 180 150">
                        <rect x="40" y="25" width="100" height="100" fill="#E0E7FF" stroke="#4F46E5" stroke-width="4" rx="4"/>
                        <text x="90" y="15" text-anchor="middle" font-weight="bold" fill="#1E293B">5 cm</text>
                        <text x="90" y="142" text-anchor="middle" font-weight="bold" fill="#1E293B">5 cm</text>
                        <text x="25" y="80" text-anchor="middle" font-weight="bold" fill="#1E293B">5 cm</text>
                        <text x="155" y="80" text-anchor="middle" font-weight="bold" fill="#1E293B">5 cm</text>
                      </svg>`,
                options: ["10 cm", "15 cm", "20 cm", "25 cm"],
                correct: 2,
                explanation: "A square has 4 sides of equal length. To find the perimeter, add all four sides together ($5 + 5 + 5 + 5 = 20\\text{ cm}$) or multiply $4 \\times 5\\text{ cm} = 20\\text{ cm}$."
            },
            {
                q: "The perimeter of a square playground is 24 inches. How long is each side?",
                svg: `<svg width="180" height="150" viewBox="0 0 180 150">
                        <rect x="40" y="25" width="100" height="100" fill="#E0F2FE" stroke="#06B6D4" stroke-width="4" rx="4"/>
                        <text x="90" y="80" text-anchor="middle" font-weight="bold" fill="#0369A1">Perimeter = 24 in</text>
                        <text x="90" y="15" text-anchor="middle" font-weight="bold" fill="#64748B">? in</text>
                      </svg>`,
                options: ["4 inches", "6 inches", "8 inches", "12 inches"],
                correct: 1,
                explanation: "Since all 4 sides of a square are equal, divide the total perimeter by 4: $24 \\div 4 = 6\\text{ inches}$ per side."
            },
            {
                q: "Eli builds a square garden with each side measuring 8 meters. How much fencing is needed to go around the entire garden?",
                svg: `<svg width="180" height="150" viewBox="0 0 180 150">
                        <rect x="40" y="25" width="100" height="100" fill="#DCFCE7" stroke="#10B981" stroke-width="4" rx="4"/>
                        <text x="90" y="15" text-anchor="middle" font-weight="bold" fill="#1E293B">8 m</text>
                        <text x="25" y="80" text-anchor="middle" font-weight="bold" fill="#1E293B">8 m</text>
                      </svg>`,
                options: ["16 meters", "24 meters", "32 meters", "64 meters"],
                correct: 2,
                explanation: "Fencing around the garden equals the perimeter. Multiply the length of one side by 4: $4 \\times 8\\text{ meters} = 32\\text{ meters}$."
            },
            {
                q: "A square floor tile has a side length of 12 cm. What is its perimeter?",
                svg: `<svg width="180" height="150" viewBox="0 0 180 150">
                        <rect x="40" y="25" width="100" height="100" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4" rx="4"/>
                        <text x="90" y="15" text-anchor="middle" font-weight="bold" fill="#1E293B">12 cm</text>
                      </svg>`,
                options: ["24 cm", "36 cm", "48 cm", "144 cm"],
                correct: 2,
                explanation: "For a square, $\\text{Perimeter} = 4 \\times \\text{side}$. Here, $4 \\times 12\\text{ cm} = 48\\text{ cm}$."
            },
            {
                q: "A square desk has a side length of 15 inches. What is the total perimeter around the top of the desk?",
                svg: `<svg width="180" height="150" viewBox="0 0 180 150">
                        <rect x="40" y="25" width="100" height="100" fill="#E0E7FF" stroke="#4F46E5" stroke-width="4" rx="4"/>
                        <text x="90" y="15" text-anchor="middle" font-weight="bold" fill="#1E293B">15 in</text>
                      </svg>`,
                options: ["30 inches", "45 inches", "60 inches", "75 inches"],
                correct: 2,
                explanation: "Add all four equal sides together: $15 + 15 + 15 + 15 = 60\\text{ inches}$."
            },
            {
                q: "What is the perimeter of a rectangle with a length of 8 cm and a width of 4 cm?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#E0E7FF" stroke="#4F46E5" stroke-width="4" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">8 cm</text>
                        <text x="110" y="128" text-anchor="middle" font-weight="bold" fill="#1E293B">8 cm</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">4 cm</text>
                        <text x="205" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">4 cm</text>
                      </svg>`,
                options: ["12 cm", "24 cm", "32 cm", "16 cm"],
                correct: 1,
                explanation: "A rectangle has 2 lengths and 2 widths. Perimeter = $\\text{length} + \\text{length} + \\text{width} + \\text{width} = 8 + 8 + 4 + 4 = 24\\text{ cm}$."
            },
            {
                q: "A picture frame is 9 inches long and 6 inches wide. What is its perimeter?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#FEF3C7" stroke="#F59E0B" stroke-width="4" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">9 in</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">6 in</text>
                      </svg>`,
                options: ["15 inches", "27 inches", "30 inches", "54 inches"],
                correct: 2,
                explanation: "Perimeter = $2 \\times (\\text{length} + \\text{width}) = 2 \\times (9 + 6) = 2 \\times 15 = 30\\text{ inches}$."
            },
            {
                q: "A swimming pool is 12 meters long and 6 meters wide. What distance do you walk if you walk all the way around the outside edge?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#E0F2FE" stroke="#06B6D4" stroke-width="4" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">12 m</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">6 m</text>
                      </svg>`,
                options: ["18 meters", "36 meters", "48 meters", "72 meters"],
                correct: 1,
                explanation: "Add all four outer sides: $12 + 12 + 6 + 6 = 36\\text{ meters}$."
            },
            {
                q: "A rectangular rug has a perimeter of 50 meters. If the length is 15 meters, what is the width?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#FCE7F3" stroke="#EC4899" stroke-width="4" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">15 m</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">? m</text>
                        <text x="110" y="75" text-anchor="middle" font-weight="bold" fill="#BE185D">Perimeter = 50 m</text>
                      </svg>`,
                options: ["10 meters", "20 meters", "35 meters", "5 meters"],
                correct: 0,
                explanation: "Two lengths equal $15 + 15 = 30\\text{ meters}$. Subtract from total perimeter: $50 - 30 = 20\\text{ meters}$ left for the 2 widths. Dividing by 2 gives a width of $10\\text{ meters}$ ($20 \\div 2 = 10$)."
            },
            {
                q: "Eli places tape along the outline of a rectangular mat that is 7 feet long and 3 feet wide. How many feet of tape does Eli use?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#DCFCE7" stroke="#10B981" stroke-width="4" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">7 ft</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">3 ft</text>
                      </svg>`,
                options: ["10 feet", "14 feet", "20 feet", "21 feet"],
                correct: 2,
                explanation: "Perimeter = $7 + 7 + 3 + 3 = 20\\text{ feet}$ of tape."
            },
            {
                q: "Shape A is a square with side length 6 cm. Shape B is a rectangle with length 7 cm and width 5 cm. Which statement is true?",
                svg: `<svg width="260" height="130" viewBox="0 0 260 130">
                        <rect x="20" y="25" width="80" height="80" fill="#E0E7FF" stroke="#4F46E5" stroke-width="3"/>
                        <text x="60" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#4F46E5">Square A (6x6)</text>
                        <rect x="130" y="25" width="110" height="80" fill="#FEF3C7" stroke="#F59E0B" stroke-width="3"/>
                        <text x="185" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#D97706">Rect B (7x5)</text>
                      </svg>`,
                options: [
                    "Shape A has a larger perimeter.",
                    "Shape B has a larger perimeter.",
                    "Both shapes have the exact same perimeter.",
                    "Neither shape has a perimeter."
                ],
                correct: 2,
                explanation: "Square A perimeter = $4 \\times 6 = 24\\text{ cm}$. Rectangle B perimeter = $7 + 7 + 5 + 5 = 24\\text{ cm}$. Both perimeters are equal to $24\\text{ cm}$!"
            },
            {
                q: "Eli wants to fence a rectangular backyard that is 10 yards long and 8 yards wide. If fencing costs $2 per yard, what is the total cost?",
                svg: `<svg width="220" height="140" viewBox="0 0 220 140">
                        <rect x="30" y="30" width="160" height="80" fill="#FEF3C7" stroke="#D97706" stroke-width="4" stroke-dasharray="8,5" rx="4"/>
                        <text x="110" y="20" text-anchor="middle" font-weight="bold" fill="#1E293B">10 yd</text>
                        <text x="15" y="75" text-anchor="middle" font-weight="bold" fill="#1E293B">8 yd</text>
                      </svg>`,
                options: ["$36", "$72", "$80", "$160"],
                correct: 1,
                explanation: "First find the perimeter: $10 + 10 + 8 + 8 = 36\\text{ yards}$. Then multiply by $2 per yard: $36 \\times \\$2 = \\$72$."
            },

            // ANGLES QUESTIONS (13 to 20)
            {
                q: "An angle that measures less than 90° (smaller than a square corner) is called an:",
                svg: `<svg width="180" height="130" viewBox="0 0 180 130">
                        <path d="M 130 100 L 40 100 L 95 30" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 60 100 A 20 20 0 0 0 54 85" fill="none" stroke="#EC4899" stroke-width="3"/>
                        <text x="80" y="85" font-weight="bold" fill="#EC4899">45°</text>
                      </svg>`,
                options: ["Obtuse angle", "Right angle", "Acute angle", "Straight angle"],
                correct: 2,
                explanation: "An acute angle is 'cute and small'—it measures greater than 0° and less than 90°."
            },
            {
                q: "An angle that measures exactly 90° and forms a perfect square corner is called a:",
                svg: `<svg width="180" height="130" viewBox="0 0 180 130">
                        <path d="M 120 100 L 40 100 L 40 20" fill="none" stroke="#06B6D4" stroke-width="4" stroke-linecap="round"/>
                        <rect x="40" y="85" width="15" height="15" fill="none" stroke="#10B981" stroke-width="3"/>
                        <text x="75" y="75" font-weight="bold" fill="#10B981">90°</text>
                      </svg>`,
                options: ["Right angle", "Acute angle", "Obtuse angle", "Straight angle"],
                correct: 0,
                explanation: "A right angle measures exactly 90° and forms a square corner (like the letter L)."
            },
            {
                q: "An angle that measures 135° (greater than 90° but less than 180°) is classified as an:",
                svg: `<svg width="200" height="130" viewBox="0 0 200 130">
                        <path d="M 160 100 L 80 100 L 25 40" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 100 100 A 20 20 0 0 0 68 87" fill="none" stroke="#D97706" stroke-width="3"/>
                        <text x="95" y="80" font-weight="bold" fill="#D97706">135°</text>
                      </svg>`,
                options: ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"],
                correct: 2,
                explanation: "An obtuse angle is wide open! It measures more than 90° and less than 180°."
            },
            {
                q: "An angle that measures exactly 180° and forms a completely flat, straight line is called a:",
                svg: `<svg width="220" height="100" viewBox="0 0 220 100">
                        <path d="M 20 60 L 200 60" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="110" cy="60" r="5" fill="#10B981"/>
                        <path d="M 130 60 A 20 20 0 0 0 90 60" fill="none" stroke="#047857" stroke-width="3"/>
                        <text x="110" y="35" text-anchor="middle" font-weight="bold" fill="#047857">180°</text>
                      </svg>`,
                options: ["Right angle", "Obtuse angle", "Straight angle", "Acute angle"],
                correct: 2,
                explanation: "A straight angle measures exactly 180° and looks just like a straight line."
            },
            {
                q: "Look at the corner of a standard sheet of paper or notebook page. What kind of angle does it form?",
                svg: `<svg width="160" height="130" viewBox="0 0 160 130">
                        <rect x="30" y="20" width="100" height="90" fill="#FFFFFF" stroke="#64748B" stroke-width="3" rx="2"/>
                        <path d="M 30 50 L 30 20 L 60 20" fill="none" stroke="#EF4444" stroke-width="4"/>
                        <rect x="30" y="20" width="12" height="12" fill="none" stroke="#EF4444" stroke-width="2"/>
                      </svg>`,
                options: ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"],
                correct: 1,
                explanation: "The corner of paper forms a perfect square corner, which is a 90° right angle."
            },
            {
                q: "What type of angle is formed by the hands on a clock when the time is exactly 3:00?",
                svg: `<svg width="160" height="150" viewBox="0 0 160 150">
                        <circle cx="80" cy="75" r="55" fill="#F8FAFC" stroke="#4F46E5" stroke-width="4"/>
                        <line x1="80" y1="75" x2="80" y2="35" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
                        <line x1="80" y1="75" x2="115" y2="75" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="80" cy="75" r="4" fill="#1E293B"/>
                        <text x="80" y="30" text-anchor="middle" font-size="10" font-weight="bold">12</text>
                        <text x="125" y="78" text-anchor="middle" font-size="10" font-weight="bold">3</text>
                      </svg>`,
                options: ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"],
                correct: 1,
                explanation: "At 3:00, the minute hand points straight up at 12 and the hour hand points right at 3, creating a 90° right angle."
            },
            {
                q: "What type of angle is formed by the hands on a clock when the time is exactly 6:00?",
                svg: `<svg width="160" height="150" viewBox="0 0 160 150">
                        <circle cx="80" cy="75" r="55" fill="#F8FAFC" stroke="#06B6D4" stroke-width="4"/>
                        <line x1="80" y1="75" x2="80" y2="35" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
                        <line x1="80" y1="75" x2="80" y2="115" stroke="#EC4899" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="80" cy="75" r="4" fill="#1E293B"/>
                        <text x="80" y="30" text-anchor="middle" font-size="10" font-weight="bold">12</text>
                        <text x="80" y="128" text-anchor="middle" font-size="10" font-weight="bold">6</text>
                      </svg>`,
                options: ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"],
                correct: 3,
                explanation: "At 6:00, one hand points straight up at 12 and the other points straight down at 6, forming a 180° straight angle."
            },
            {
                q: "Eli opens a pair of scissors wide so that the opening between blades measures 110°. What type of angle is this?",
                svg: `<svg width="180" height="130" viewBox="0 0 180 130">
                        <path d="M 150 95 L 80 70 L 30 110" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
                        <path d="M 150 45 L 80 70 L 30 30" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
                        <circle cx="80" cy="70" r="5" fill="#EF4444"/>
                        <text x="120" y="75" font-weight="bold" fill="#D97706">110°</text>
                      </svg>`,
                options: ["Acute angle", "Right angle", "Obtuse angle", "Straight angle"],
                correct: 2,
                explanation: "Since 110° is wider than a right angle (90°) but less than a flat line (180°), it is an obtuse angle."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let currentViewMode = 'single'; // 'single' or 'all'

        function initQuiz() {
            renderQuiz();
            updateProgress();
        }

        function switchMode(mode) {
            currentViewMode = mode;
            document.getElementById('single-mode-btn').classList.toggle('active', mode === 'single');
            document.getElementById('all-mode-btn').classList.toggle('active', mode === 'all');
            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';
            document.getElementById('results-card').style.display = 'none';

            if (currentViewMode === 'single') {
                const q = quizData[currentQuestionIndex];
                container.appendChild(createQuestionCard(q, currentQuestionIndex));
                renderNavButtons(container);
            } else {
                quizData.forEach((q, idx) => {
                    container.appendChild(createQuestionCard(q, idx));
                });
            }
        }

        function createQuestionCard(q, idx) {
            const card = document.createElement('div');
            card.className = 'question-card';
            card.id = `q-card-${idx}`;

            const answered = userAnswers[idx] !== null;
            const selectedOpt = userAnswers[idx];

            card.innerHTML = `
                <div class="question-number">
                    <span>📌 Question ${idx + 1} of ${quizData.length}</span>
                </div>
                <div class="question-text">${q.q}</div>
                ${q.svg ? `<div class="svg-container">${q.svg}</div>` : ''}
                <div class="options-grid">
                    ${q.options.map((opt, oIdx) => {
                        let classList = "option-btn";
                        if (answered) {
                            if (oIdx === q.correct) classList += " selected-correct";
                            else if (oIdx === selectedOpt) classList += " selected-incorrect";
                        }
                        return `<button class="${classList}" ${answered ? 'disabled' : ''} onclick="handleAnswer(${idx}, ${oIdx})">
                                    <span>${opt}</span>
                                    ${answered && oIdx === q.correct ? '<span>✓</span>' : ''}
                                    ${answered && oIdx === selectedOpt && oIdx !== q.correct ? '<span>✗</span>' : ''}
                                </button>`;
                    }).join('')}
                </div>
                <div class="explanation-box ${answered ? 'visible' : ''}">
                    <div class="explanation-title">💡 Explanation:</div>
                    <div>${q.explanation}</div>
                </div>
            `;
            return card;
        }

        function handleAnswer(qIdx, optionIdx) {
            if (userAnswers[qIdx] !== null) return;

            userAnswers[qIdx] = optionIdx;
            if (optionIdx === quizData[qIdx].correct) {
                score++;
            }

            document.getElementById('score-display').textContent = score;
            updateProgress();

            if (currentViewMode === 'single') {
                renderQuiz();
            } else {
                const card = document.getElementById(`q-card-${qIdx}`);
                const updatedCard = createQuestionCard(quizData[qIdx], qIdx);
                card.replaceWith(updatedCard);
            }

            // Check if all answered
            if (userAnswers.every(ans => ans !== null) && currentViewMode === 'all') {
                showResults();
            }
        }

        function renderNavButtons(container) {
            const nav = document.createElement('div');
            nav.className = 'nav-controls';

            const prevBtn = document.createElement('button');
            prevBtn.className = 'action-btn';
            prevBtn.textContent = '← Previous';
            prevBtn.disabled = currentQuestionIndex === 0;
            prevBtn.onclick = () => {
                if (currentQuestionIndex > 0) {
                    currentQuestionIndex--;
                    document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
                    renderQuiz();
                }
            };

            const nextBtn = document.createElement('button');
            nextBtn.className = 'action-btn';
            const isLast = currentQuestionIndex === quizData.length - 1;
            nextBtn.textContent = isLast ? 'Finish Quiz 🎉' : 'Next →';
            nextBtn.onclick = () => {
                if (isLast) {
                    showResults();
                } else {
                    currentQuestionIndex++;
                    document.getElementById('current-q-num').textContent = currentQuestionIndex + 1;
                    renderQuiz();
                }
            };

            nav.appendChild(prevBtn);
            nav.appendChild(nextBtn);
            container.appendChild(nav);
        }

        function updateProgress() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const pct = (answeredCount / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = pct + '%';
        }

        function showResults() {
            document.getElementById('quiz-container').innerHTML = '';
            const resultsCard = document.getElementById('results-card');
            resultsCard.style.display = 'block';

            document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;

            let msg = "";
            const pct = (score / quizData.length) * 100;
            if (pct === 100) {
                msg = "🌟 Perfect Score! Eli is a Geometry Master!";
            } else if (pct >= 80) {
                msg = "👏 Fantastic job! Excellent understanding of perimeters and angles!";
            } else if (pct >= 60) {
                msg = "👍 Good effort! Review the explanations to master every question!";
            } else {
                msg = "💪 Keep practicing! Go through the answers to strengthen your geometry skills!";
            }
            document.getElementById('final-message').textContent = msg;
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            userAnswers = new Array(quizData.length).fill(null);
            document.getElementById('score-display').textContent = '0';
            document.getElementById('current-q-num').textContent = '1';
            initQuiz();
        }

        // Initialize on load
        window.onload = initQuiz;
    </script>
</body>
</html>
